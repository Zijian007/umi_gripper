[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umi-gripper"
version = "0.1.2"
description = "Two-channel STS bus-servo gripper controller"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial==3.5",
    "ftservo-python-sdk==2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.3"]

[project.scripts]
umi-calibrate = "umi_gripper.cli.calibrate:cli"
umi-id = "umi_gripper.cli.identifier:cli"
umi-demo = "umi_gripper.cli.demo:cli"

[tool.setuptools]
packages = ["umi_gripper", "umi_gripper.cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
required-version = "==0.17.3"
target-version = "py310"
line-length = 100
extend-exclude = ["third_party", "build", "dist", "wheelhouse", "artifacts"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP006", "UP007", "UP035", "UP045"]
