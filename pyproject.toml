[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umi-gripper"
version = "0.1.0"
description = "Two-channel STS bus-servo gripper controller"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial==3.5",
    "ftservo-python-sdk==2.0.0",
]

[tool.setuptools]
py-modules = ["gripper", "fake_bus"]
